<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }

        .bg-login {
            background: linear-gradient(rgba(240, 253, 244, 0.7), rgba(209, 250, 229, 0.8)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(6, 78, 59, 0.12);
        }

        /* INPUTS ESTILO CLEAN */
        .soft-input {
            @apply w-full bg-gray-100 border-2 border-transparent p-3.5 rounded-2xl text-sm text-gray-800 transition-all outline-none focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10;
        }

        .label-style {
            @apply block text-[10px] font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-2;
        }

        /* AJUSTE DAS TABS (Para funcionar com seu JS original) */
        .tab-btn {
            @apply flex-1 py-3 text-sm font-bold rounded-xl transition-all duration-300 text-gray-400;
        }
        .tab-btn.active {
            @apply bg-white text-emerald-700 shadow-sm ring-1 ring-black/5;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-4">

<div class="soft-card w-full max-w-lg p-8 md:p-12 overflow-hidden">
    
    <!-- Header -->
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-12 h-12 rounded-2xl shadow-lg mb-4 text-white">
            <i class="fas fa-apple-whole text-xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-400 text-[10px] font-bold uppercase tracking-[0.2em] mt-1">Sua saúde, nossa métrica</p>
    </div>

    <!-- Navegação corrigida para o seu JS -->
    <div class="flex bg-gray-100 rounded-[1.25rem] p-1.5 mb-10 border border-gray-200">
        <button onclick="switchTab(event, 'cadastro')" id="tab-cadastro" class="tab-btn active">Cadastrar</button>
        <button onclick="switchTab(event, 'login')" id="tab-login" class="tab-btn">Acessar Painel</button>
    </div>

    <!-- CADASTRO -->
    <div id="cadastro" class="form-section active space-y-6">
        <div class="grid grid-cols-1 gap-5">
            <div>
                <label class="label-style">Nome Completo</label>
                <input type="text" id="nome" class="soft-input" placeholder="Seu nome">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label class="label-style">E-mail</label>
                    <input type="email" id="email" class="soft-input" placeholder="seu@email.com">
                </div>
                <div>
                    <label class="label-style">Senha</label>
                    <input type="password" id="senha" class="soft-input" placeholder="••••••••">
                </div>
            </div>

            <div class="border-t border-gray-100 pt-5 mt-2">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="label-style">Idade</label>
                        <input type="number" id="idade" class="soft-input">
                    </div>
                    <div>
                        <label class="label-style">Sexo</label>
                        <select id="sexo" class="soft-input px-2">
                            <option value="Feminino">Fem</option>
                            <option value="Masculino">Masc</option>
                        </select>
                    </div>
                    <div>
                        <label class="label-style">Peso</label>
                        <input type="number" id="peso" step="0.1" class="soft-input" placeholder="kg">
                    </div>
                    <div>
                        <label class="label-style">Altura</label>
                        <input type="number" id="altura" step="0.01" class="soft-input" placeholder="m">
                    </div>
                </div>
            </div>

            <div>
                <label class="label-style">Nível de Atividade</label>
                <select id="atividade" class="soft-input">
                    <option value="Sedentario">Sedentário (Pouca)</option>
                    <option value="Ativo">Ativo (Moderada)</option>
                    <option value="Muito Ativo">Muito Ativo (Intensa)</option>
                </select>
            </div>
        </div>

        <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-3">
            Concluir Cadastro <i class="fas fa-check-circle"></i>
        </button>
    </div>

    <!-- LOGIN -->
    <div id="login" class="form-section space-y-6">
        <div class="flex justify-center mb-4">
            <div class="bg-emerald-50 w-20 h-20 flex items-center justify-center rounded-full text-emerald-600 text-4xl">
                <i class="fas fa-user-circle"></i>
            </div>
        </div>
        <div class="space-y-4">
            <div>
                <label class="label-style">Seu E-mail</label>
                <input type="email" id="login_email" class="soft-input" placeholder="email@exemplo.com">
            </div>
            <div>
                <label class="label-style">Senha</label>
                <input type="password" id="login_senha" class="soft-input" placeholder="••••••••">
            </div>
        </div>
        <button onclick="login()" class="w-full bg-gray-950 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-xl transition-all transform active:scale-95 flex items-center justify-center gap-3">
            Entrar no Portal <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <!-- Feedback -->
    <div id="resultado" class="mt-8 p-4 rounded-2xl text-xs font-bold border text-center transition-all duration-300 hidden"></div>

</div>

<!-- JAVASCRIPT ORIGINAL SEM ALTERAÇÕES DE LÓGICA -->
<script>
    const API_URL = 'https://bsfm-production.up.railway.app';

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active'); 
        event.currentTarget.classList.add('active');
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('resultado').classList.add('hidden');
    }

    async function cadastrar() {
        const resDiv = document.getElementById('resultado');
        const dados = {
            Nome: document.getElementById('nome').value,
            Email: document.getElementById('email').value,
            SenhaHash: document.getElementById('senha').value,
            Idade: parseInt(document.getElementById('idade').value),
            Peso: parseFloat(document.getElementById('peso').value),
            Altura: parseFloat(document.getElementById('altura').value),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        if(!dados.Nome || !dados.Email || !dados.SenhaHash) {
            exibirMensagem("⚠️ Atenção: Preencha Nome, Email e Senha!", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await resp.json();
            
            exibirMensagem(`✅ ${data.mensagem}<br>Acesse a aba 'Login' para continuar.`, "#f0fdf4", "#166534", "#dcfce7");
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resp.ok) {
                const user = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(user));
                window.location.href = 'dashboard.html'; 
            } else {
                exibirMensagem("⚠️ E-mail ou senha incorretos.", "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.classList.remove('hidden');
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.innerHTML = texto;
    }
</script>

</body>
</html>
