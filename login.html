<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .bg-login {
            background: linear-gradient(rgba(5, 150, 105, 0.4), rgba(6, 78, 59, 0.7)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Glassmorphism soft */
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Abas Estilizadas */
        .tab-btn {
            @apply flex-1 py-3 text-sm font-bold transition-all duration-300 rounded-full text-gray-400;
        }
        .tab-btn.active {
            @apply bg-white text-emerald-700 shadow-md transform scale-105;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.5s ease-out; }

        input, select {
            @apply w-full p-4 bg-gray-50 border border-gray-200 rounded-2xl text-sm transition-all duration-300 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none;
        }

        label {
            @apply block text-[10px] font-black text-emerald-800 mb-2 ml-1 uppercase tracking-widest opacity-80;
        }

        /* Card de agrupamento interno */
        .field-group {
            @apply bg-gray-50/50 p-5 rounded-[2rem] border border-gray-100;
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-4 md:p-10">

<div class="glass-card w-full max-w-xl rounded-[3rem] shadow-2xl p-8 md:p-14 my-10">
    
    <!-- HEADER -->
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-16 h-16 rounded-3xl shadow-xl shadow-emerald-200 mb-6">
            <i class="fas fa-apple-whole text-white text-3xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-emerald-950 tracking-tight">Portal BSFM</h2>
        <p class="text-emerald-700/60 text-sm mt-2 font-medium">Sua saúde personalizada com inteligência.</p>
    </div>

    <!-- NAVEGAÇÃO ENTRE ABAS (FIXADO) -->
    <div class="bg-gray-100/80 p-1.5 rounded-full flex gap-1 mb-10">
        <button class="tab-btn active" id="tab-cadastro" onclick="switchTab(event, 'cadastro')">Criar Conta</button>
        <button class="tab-btn" id="tab-login" onclick="switchTab(event, 'login')">Acessar Painel</button>
    </div>

    <!-- SEÇÃO DE CADASTRO -->
    <div id="cadastro" class="form-section active space-y-8">
        
        <!-- Grupo: Identificação -->
        <div class="space-y-5">
            <div>
                <label><i class="fas fa-user mr-2"></i>Nome Completo</label>
                <input type="text" id="nome" placeholder="Como deseja ser chamado?">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div>
                    <label><i class="fas fa-envelope mr-2"></i>E-mail profissional</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>
                <div>
                    <label><i class="fas fa-lock mr-2"></i>Crie uma senha</label>
                    <input type="password" id="senha" placeholder="••••••••">
                </div>
            </div>
        </div>

        <!-- Grupo: Biometria (Visualmente separado para ser intuitivo) -->
        <div class="field-group space-y-6">
            <h4 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center border-b border-gray-200 pb-3 mb-4">Informações de Saúde</h4>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="col-span-1">
                    <label>Idade</label>
                    <input type="number" id="idade" placeholder="00">
                </div>
                <div class="col-span-1">
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="Feminino">Fem</option>
                        <option value="Masculino">Masc</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label>Peso (kg)</label>
                    <input type="number" id="peso" step="0.1" placeholder="70.0">
                </div>
                <div class="col-span-1">
                    <label>Altura (m)</label>
                    <input type="number" id="altura" step="0.01" placeholder="1.70">
                </div>
            </div>

            <div>
                <label><i class="fas fa-person-running mr-2"></i>Frequência de Atividade</label>
                <select id="atividade">
                    <option value="Sedentario">Sedentário (Pouco/Nenhum)</option>
                    <option value="Ativo">Ativo (Exercício 3-5x/sem)</option>
                    <option value="Muito Ativo">Muito Ativo (Atleta/Intenso)</option>
                </select>
            </div>
        </div>

        <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-5 rounded-[2rem] shadow-lg shadow-emerald-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3 mt-4">
            <span>Finalizar Cadastro</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>
    </div>

    <!-- SEÇÃO DE LOGIN -->
    <div id="login" class="form-section space-y-6 pt-4">
        <div class="bg-emerald-50 rounded-[2.5rem] p-8 text-center mb-6">
            <i class="fas fa-user-circle text-emerald-200 text-6xl mb-2"></i>
            <p class="text-emerald-800 font-semibold italic text-sm">Bem-vindo de volta!</p>
        </div>
        
        <div class="space-y-4">
            <div>
                <label>E-mail cadastrado</label>
                <input type="email" id="login_email" placeholder="exemplo@gmail.com">
            </div>
            <div>
                <label>Senha de acesso</label>
                <input type="password" id="login_senha" placeholder="••••••••">
            </div>
        </div>

        <button onclick="login()" class="w-full bg-gray-950 hover:bg-black text-white font-bold py-5 rounded-[2rem] shadow-xl transition-all transform hover:-translate-y-1 active:scale-95 mt-6">
            Entrar no Sistema <i class="fas fa-sign-in-alt ml-2"></i>
        </button>
    </div>

    <!-- MENSAGENS DE FEEDBACK -->
    <div id="resultado" class="mt-8 p-5 rounded-3xl text-sm font-semibold border text-center transition-all duration-300 hidden"></div>

</div>

<!-- JAVASCRIPT ORIGINAL PRESERVADO INTEGRALMENTE -->
<script>
    const API_URL = 'https://bsfm-production.up.railway.app';

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active'); 
        event.currentTarget.classList.add('active');
        document.getElementById('resultado').style.display = 'none';
    }

    async function cadastrar() {
        const resDiv = document.getElementById('resultado');
        const dados = {
            Nome: document.getElementById('nome').value,
            Email: document.getElementById('email').value,
            SenhaHash: document.getElementById('senha').value,
            Idade: parseInt(document.getElementById('idade').value),
            Peso: parseFloat(document.getElementById('peso').value),
            Altura: parseFloat(document.getElementById('altura').value),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        if(!dados.Nome || !dados.Email || !dados.SenhaHash) {
            exibirMensagem("⚠️ Atenção: Preencha Nome, Email e Senha!", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await resp.json();
            
            exibirMensagem(`✅ ${data.mensagem}<br>Acesse a aba 'Login' para continuar.`, "#f0fdf4", "#166534", "#dcfce7");
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resp.ok) {
                const user = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(user));
                window.location.href = 'dashboard.html'; 
            } else {
                exibirMensagem("⚠️ E-mail ou senha incorretos.", "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.innerHTML = texto;
    }
</script>

</body>
</html>
