<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .bg-login {
            background: linear-gradient(rgba(5, 150, 105, 0.4), rgba(6, 78, 59, 0.7)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
        }

        /* Glassmorphism soft */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Abas no estilo da Landing Page */
        .tab-btn {
            @apply flex-1 py-3 text-sm font-semibold transition-all duration-300 rounded-full text-gray-500 border border-transparent;
        }
        .tab-btn.active {
            @apply bg-emerald-100 text-emerald-800 border-emerald-200 shadow-sm;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }

        input, select {
            @apply w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all duration-300;
        }
        input:focus, select:focus {
            @apply outline-none border-emerald-500 ring-2 ring-emerald-500/20 bg-white;
        }

        label {
            @apply block text-xs font-bold text-gray-600 mb-1 ml-1 uppercase tracking-wider;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-6">

<div class="glass-card w-full max-w-lg rounded-[2.5rem] shadow-2xl p-8 md:p-12 overflow-hidden">
    
    <!-- HEADER -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center bg-emerald-600 p-3 rounded-2xl shadow-lg mb-4">
            <i class="fas fa-apple-whole text-white text-2xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-500 text-sm mt-1 font-medium italic">A tecnologia a favor da sua saúde</p>
    </div>

    <!-- TABS CENTRALIZADAS -->
    <div class="bg-gray-100 p-1.5 rounded-full flex gap-1 mb-8">
        <button class="tab-btn active" id="tab-cadastro" onclick="switchTab(event, 'cadastro')">Criar Conta</button>
    </div>
        <div class="bg-gray-100 p-1.5 rounded-full flex gap-1 mb-8">
        <button class="tab-btn" id="tab-login" onclick="switchTab(event, 'login')">Acessar Painel</button>
    </div>

    <!-- SEÇÃO DE CADASTRO -->
    <div id="cadastro" class="form-section active space-y-4">
        <div>
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Ex: Maria Silva">
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label>E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com">
            </div>
            <div>
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="md:col-span-1">
                <label>Idade</label>
                <input type="number" id="idade">
            </div>
            <div class="md:col-span-1">
                <label>Sexo</label>
                <select id="sexo">
                    <option value="Feminino">Fem</option>
                    <option value="Masculino">Masc</option>
                </select>
            </div>
            <div class="md:col-span-1">
                <label>Peso (kg)</label>
                <input type="number" id="peso" step="0.1" placeholder="70">
            </div>
            <div class="md:col-span-1">
                <label>Altura (m)</label>
                <input type="number" id="altura" step="0.01" placeholder="1.65">
            </div>
        </div>

        <div>
            <label>Nível de Atividade Física</label>
            <select id="atividade">
                <option value="Sedentario">Sedentário (Pouco/Nenhum)</option>
                <option value="Ativo">Ativo (Exercício 3-5x/sem)</option>
                <option value="Muito Ativo">Muito Ativo (Atleta/Intenso)</option>
            </select>
        </div>

        <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 mt-4">
            Finalizar Meu Cadastro <i class="fas fa-check-circle ml-2"></i>
        </button>
    </div>

    <!-- SEÇÃO DE LOGIN -->
    <div id="login" class="form-section space-y-6">
        <div class="pt-4 text-center">
            <i class="fas fa-lock text-emerald-200 text-5xl mb-4"></i>
        </div>
        <div>
            <label>E-mail do Usuário</label>
            <input type="email" id="login_email" placeholder="seu@email.com">
        </div>
        <div>
            <label>Sua Senha</label>
            <input type="password" id="login_senha" placeholder="••••••••">
        </div>
        <button onclick="login()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform hover:-translate-y-1 mt-4">
            Entrar no Portal <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>

    <!-- MENSAGENS DE FEEDBACK -->
    <div id="resultado" class="mt-8 p-4 rounded-2xl text-sm font-medium border text-center transition-all duration-300"></div>

</div>

<!-- JAVASCRIPT ORIGINAL PRESERVADO -->
<script>
    const API_URL = 'https://bsfm-production.up.railway.app';

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active'); 
        event.currentTarget.classList.add('active');
        document.getElementById('resultado').style.display = 'none';
    }

    async function cadastrar() {
        const resDiv = document.getElementById('resultado');
        const dados = {
            Nome: document.getElementById('nome').value,
            Email: document.getElementById('email').value,
            SenhaHash: document.getElementById('senha').value,
            Idade: parseInt(document.getElementById('idade').value),
            Peso: parseFloat(document.getElementById('peso').value),
            Altura: parseFloat(document.getElementById('altura').value),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        if(!dados.Nome || !dados.Email || !dados.SenhaHash) {
            exibirMensagem("⚠️ Atenção: Preencha Nome, Email e Senha!", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await resp.json();
            
            exibirMensagem(`✅ ${data.mensagem}<br>Acesse a aba 'Login' para continuar.`, "#f0fdf4", "#166534", "#dcfce7");
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resp.ok) {
                const user = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(user));
                window.location.href = 'dashboard.html'; 
            } else {
                exibirMensagem("⚠️ E-mail ou senha incorretos.", "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.innerHTML = texto;
    }
</script>

</body>
</html>
