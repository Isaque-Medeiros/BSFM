<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Fundo suave com a imagem da landing page */
        .bg-login {
            background: linear-gradient(rgba(240, 253, 244, 0.8), rgba(209, 250, 229, 0.9)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Card estilo Soft/Glass */
        .soft-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(6, 78, 59, 0.15);
        }

        /* ESTILO SOFT INPUT - É AQUI QUE O VISUAL FICA MODERNO */
        .soft-input {
            width: 100%;
            background-color: #f3f4f6; /* Cinza bem clarinho */
            border: 2px solid transparent;
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            color: #1f2937;
            transition: all 0.3s ease;
            outline: none !important;
        }

        .soft-input:focus {
            background-color: #ffffff;
            border-color: #10b981; /* Verde esmeralda */
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* Rótulos (Labels) */
        .label-style {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            margin-left: 0.5rem;
        }

        /* Abas de troca (Switch) */
        .tab-active {
            background: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-6">

<div class="soft-card w-full max-w-lg p-8 md:p-12">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-12 h-12 rounded-2xl shadow-lg mb-4 text-white text-xl">
            <i class="fas fa-apple-whole"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-400 text-xs font-medium uppercase tracking-widest mt-1">Sua saúde, nossa métrica</p>
    </div>

    <!-- Navegação Soft -->
    <div class="flex bg-gray-100 rounded-2xl p-1 mb-8">
        <button onclick="switchTab(event, 'cadastro')" id="btn-cadastro" class="flex-1 py-3 text-sm rounded-xl transition tab-active">Cadastrar</button>
        <button onclick="switchTab(event, 'login')" id="btn-login" class="flex-1 py-3 text-sm rounded-xl transition text-gray-500">Entrar</button>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <div id="cadastro" class="form-section active">
        <div class="flex flex-col gap-5">
            <div>
                <label class="label-style">Nome Completo</label>
                <input type="text" id="nome" class="soft-input" placeholder="Ex: Maria Souza">
            </div>

            <div>
                <label class="label-style">Seu melhor E-mail</label>
                <input type="email" id="email" class="soft-input" placeholder="email@exemplo.com">
            </div>

            <div>
                <label class="label-style">Defina uma Senha</label>
                <input type="password" id="senha" class="soft-input" placeholder="••••••••">
            </div>

            <div>
                <label class="label-style">Qual sua Idade?</label>
                <input type="number" id="idade" class="soft-input" placeholder="Digite sua idade">
            </div>

            <div>
                <label class="label-style">Sexo Biológico</label>
                <select id="sexo" class="soft-input">
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="label-style">Peso Atual (kg)</label>
                    <input type="number" id="peso" class="soft-input" step="0.1" placeholder="Ex: 70">
                </div>
                <div>
                    <label class="label-style">Sua Altura (m)</label>
                    <input type="number" id="altura" class="soft-input" step="0.01" placeholder="Ex: 1.65">
                </div>
            </div>

            <div>
                <label class="label-style">Frequência de Atividade</label>
                <select id="atividade" class="soft-input">
                    <option value="Sedentario">Sedentário (Pouca)</option>
                    <option value="Ativo">Ativo (Moderada)</option>
                    <option value="Muito Ativo">Muito Ativo (Atleta)</option>
                </select>
            </div>

            <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 mt-4">
                Criar Minha Conta <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="login" class="form-section">
        <div class="flex flex-col gap-6">
            <div class="flex justify-center mb-2">
                <div class="bg-gray-50 p-6 rounded-full text-emerald-100 text-4xl shadow-inner">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>

            <div>
                <label class="label-style">E-mail</label>
                <input type="email" id="login_email" class="soft-input" placeholder="Seu e-mail">
            </div>

            <div>
                <label class="label-style">Senha</label>
                <input type="password" id="login_senha" class="soft-input" placeholder="••••••••">
            </div>

            <button onclick="login()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 mt-4">
                Entrar no Portal <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
        </div>
    </div>

    <!-- Feedback (Aparecerá flutuando sobre o card) -->
    <div id="resultado" class="hidden mt-6 p-4 rounded-2xl text-sm font-semibold text-center border"></div>

</div>
<!-- JAVASCRIPT ORIGINAL PRESERVADO -->
<script>
    const API_URL = 'https://bsfm-production.up.railway.app';

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active'); 
        event.currentTarget.classList.add('active');
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('resultado').classList.add('hidden');
    }

    async function cadastrar() {
        const resDiv = document.getElementById('resultado');
        const dados = {
            Nome: document.getElementById('nome').value,
            Email: document.getElementById('email').value,
            SenhaHash: document.getElementById('senha').value,
            Idade: parseInt(document.getElementById('idade').value),
            Peso: parseFloat(document.getElementById('peso').value),
            Altura: parseFloat(document.getElementById('altura').value),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        if(!dados.Nome || !dados.Email || !dados.SenhaHash) {
            exibirMensagem("⚠️ Atenção: Preencha Nome, Email e Senha!", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await resp.json();
            
            exibirMensagem(`✅ ${data.mensagem}<br>Acesse a aba 'Login' para continuar.`, "#f0fdf4", "#166534", "#dcfce7");
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resp.ok) {
                const user = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(user));
                window.location.href = 'dashboard.html'; 
            } else {
                exibirMensagem("⚠️ E-mail ou senha incorretos.", "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.classList.remove('hidden');
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.innerHTML = texto;
    }
</script>

</body>
</html>
