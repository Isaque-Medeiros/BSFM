<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }

        .bg-login {
            background: linear-gradient(rgba(240, 253, 244, 0.8), rgba(209, 250, 229, 0.9)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(6, 78, 59, 0.15);
        }

        .soft-input {
            width: 100%;
            background-color: #f3f4f6;
            border: 2px solid transparent;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            color: #1f2937;
            transition: all 0.3s ease;
            outline: none !important;
        }

        .soft-input:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .label-style {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            margin-left: 0.5rem;
        }

        .tab-btn {
            @apply flex-1 py-3 text-sm rounded-xl transition-all duration-300 font-medium;
        }
        .tab-active {
            background: #d1fae5;
            color: #065f46;
            font-weight: 700;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .tab-inactive {
            color: #6b7280;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo especial para o Input de Token */
        .token-input {
            letter-spacing: 1rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding-left: 2rem;
        }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-6">

<div class="soft-card w-full max-w-lg p-8 md:p-10">
    
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-12 h-12 rounded-2xl shadow-lg mb-4 text-white text-xl">
            <i class="fas fa-apple-whole"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-400 text-xs font-medium uppercase tracking-widest mt-1">Sua saúde, nossa métrica</p>
    </div>

    <!-- Navegação de Abas -->
    <div id="nav-tabs" class="flex bg-gray-100 rounded-2xl p-1.5 mb-8">
        <button onclick="switchTab(event, 'cadastro')" id="btn-cadastro" class="tab-btn tab-active">Criar Conta</button>
        <button onclick="switchTab(event, 'login')" id="btn-login" class="tab-btn tab-inactive">Entrar</button>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <div id="cadastro" class="form-section active">
        <div class="flex flex-col gap-4">
            <div>
                <label class="label-style">Nome Completo</label>
                <input type="text" id="nome" class="soft-input" placeholder="Ex: Maria Souza">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-style">Seu melhor E-mail</label>
                    <input type="email" id="email" class="soft-input" placeholder="email@exemplo.com">
                </div>
                <div>
                    <label class="label-style">Senha</label>
                    <input type="password" id="senha" class="soft-input" placeholder="••••••••">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="col-span-1">
                    <label class="label-style">Idade</label>
                    <input type="number" id="idade" class="soft-input" placeholder="25">
                </div>
                <div class="col-span-1">
                    <label class="label-style">Sexo</label>
                    <select id="sexo" class="soft-input">
                        <option value="Feminino">Fem</option>
                        <option value="Masculino">Masc</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="label-style">Peso(kg)</label>
                    <input type="number" id="peso" class="soft-input" step="0.1" placeholder="70">
                </div>
                <div class="col-span-1">
                    <label class="label-style">Altura(m)</label>
                    <input type="number" id="altura" class="soft-input" step="0.01" placeholder="1.65">
                </div>
            </div>

            <div>
                <label class="label-style">Frequência de Atividade</label>
                <select id="atividade" class="soft-input">
                    <option value="Sedentario">Sedentário (Pouca)</option>
                    <option value="Ativo">Ativo (Moderada)</option>
                    <option value="Muito Ativo">Muito Ativo (Atleta)</option>
                </select>
            </div>

            <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 mt-4">
                Finalizar Meu Cadastro <i class="fas fa-check-circle ml-2"></i>
            </button>
        </div>
    </div>

    <!-- SEÇÃO DE VERIFICAÇÃO DE TOKEN (Adicionada) -->
    <div id="verificacao-token" class="form-section">
        <div class="text-center mb-6">
            <i class="fas fa-envelope-open-text text-emerald-500 text-5xl mb-4"></i>
            <h3 class="text-lg font-bold text-gray-800">Verifique seu E-mail</h3>
            <p class="text-sm text-gray-500">Enviamos um código de 6 dígitos para o e-mail cadastrado.</p>
        </div>
        
        <div class="space-y-6">
            <div>
                <label class="label-style text-center">Digite o Código</label>
                <input type="text" id="token_input" class="soft-input token-input" maxlength="6" placeholder="000000">
            </div>

            <button onclick="verificarToken()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95">
                Verificar e Ativar Conta <i class="fas fa-shield-alt ml-2"></i>
            </button>

            <button onclick="switchTab(event, 'cadastro')" class="w-full text-gray-400 text-sm hover:text-gray-600 transition">
                Usar outro e-mail
            </button>
        </div>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div id="login" class="form-section">
        <div class="flex flex-col gap-6">
            <div class="flex justify-center mb-2">
                <div class="bg-emerald-50 p-6 rounded-full text-emerald-300 text-5xl shadow-inner">
                    <i class="fas fa-user-lock"></i>
                </div>
            </div>

            <div>
                <label class="label-style">E-mail de acesso</label>
                <input type="email" id="login_email" class="soft-input" placeholder="seu@email.com">
            </div>

            <div>
                <label class="label-style">Sua Senha</label>
                <input type="password" id="login_senha" class="soft-input" placeholder="••••••••">
            </div>

            <button onclick="login()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95 mt-2">
                Entrar no Painel <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
        </div>
    </div>

    <!-- MENSAGEM DE FEEDBACK -->
    <div id="resultado" class="hidden mt-6 p-4 rounded-2xl text-sm font-semibold text-center border transition-all duration-300"></div>

</div>

<script>
    const API_URL = 'https://bsfm-production.up.railway.app';
    let emailRegistrado = ""; // Variável global para saber qual email verificar

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active'); 

        // Mostra abas de volta se estava na verificação
        document.getElementById('nav-tabs').classList.remove('hidden');

        document.querySelectorAll('button[id^="btn-"]').forEach(btn => {
            btn.classList.remove('tab-active');
            btn.classList.add('text-gray-500');
        });
        
        if(event && event.currentTarget) {
            event.currentTarget.classList.add('tab-active');
            event.currentTarget.classList.remove('text-gray-500');
        }

        document.getElementById('resultado').style.display = 'none';
        document.getElementById('resultado').classList.add('hidden');
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        if (!resDiv) return;
        resDiv.innerHTML = texto;
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.classList.remove('hidden');
        resDiv.style.display = "block";
    }

    async function cadastrar() {
    const btn = event.currentTarget;
    const originalText = btn.innerHTML;
    
    // UI FEEDBACK: Mostra que está carregando para o usuário não se desesperar
    btn.innerHTML = `<i class='fas fa-circle-notch fa-spin'></i> Criando conta...`;
    btn.disabled = true;

    const dados = {
        Nome: document.getElementById('nome').value,
        Email: document.getElementById('email').value,
        SenhaHash: document.getElementById('senha').value,
        Idade: parseInt(document.getElementById('idade').value) || 0,
        Peso: parseFloat(document.getElementById('peso').value) || 0,
        Altura: parseFloat(document.getElementById('altura').value) || 0,
        Sexo: document.getElementById('sexo').value,
        TipoPessoa: document.getElementById('atividade').value,
        AceitouTermos: true
    };

    try {
        const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dados)
        });

        if (resp.ok) {
            emailRegistrado = dados.Email;
            exibirMensagem("🚀 Perfil criado! Verifique o código no seu e-mail.", "#f0fdf4", "#166534", "#dcfce7");
            setTimeout(() => switchTab(null, 'verificacao-token'), 2000);
        } else {
            const data = await resp.json();
            exibirMensagem(`⚠️ ${data.mensagem}`, "#fffbeb", "#92400e", "#fef3c7");
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    } catch (err) {
        exibirMensagem("❌ Erro de conexão. Verifique se o servidor está ativo.", "#fef2f2", "#991b1b", "#fee2e2");
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}


    // NOVA FUNÇÃO: VERIFICAR TOKEN
    async function verificarToken() {
        const token = document.getElementById('token_input').value;

        if (token.length < 6) {
            exibirMensagem("⚠️ O código deve ter 6 dígitos.", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/verificar-token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Email: emailRegistrado, Token: token })
            });

            const data = await resp.json();

            if (resp.ok) {
                exibirMensagem(`✅ Sucesso! ${data.mensagem}`, "#f0fdf4", "#166534", "#dcfce7");
                setTimeout(() => {
                    switchTab(null, 'login'); // Manda para o Login após verificar
                    document.getElementById('btn-login').click();
                }, 2000);
            } else {
                exibirMensagem(`⚠️ ${data.mensagem}`, "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao validar código.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }
    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        if(!dados.Email || !dados.Senha) {
            exibirMensagem("⚠️ Preencha todos os campos para entrar.", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            const data = await resp.json();

            if (resp.ok) {
                // LOGIN SUCESSO (Status 200)
                localStorage.setItem('usuarioLogado', JSON.stringify(data));
                window.location.href = 'dashboard.html'; 
            } 
            else if (resp.status === 401) {
                // CONTA NÃO ATIVADA (Status 401)
                // Salva o email na memória e sugere ir para a tela de token se você quiser
                emailRegistrado = dados.Email; 
                exibirMensagem(data.mensagem, "#fffbeb", "#92400e", "#fef3c7");
                
                // Opcional: Mostrar o botão de verificação após 3 segundos
                setTimeout(() => {
                    document.getElementById('nav-tabs').classList.add('hidden');
                    switchTab(null, 'verificacao-token');
                }, 3000);
            }
            else {
                // ERRO COMUM (E-mail/Senha errados)
                exibirMensagem(`⚠️ ${data.mensagem}`, "#fef2f2", "#991b1b", "#fee2e2");
            }
        } catch (err) {
            exibirMensagem("❌ Erro de conexão com o portal.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }
</script>

</body>
</html>
