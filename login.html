<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .bg-login {
            background: linear-gradient(rgba(5, 150, 105, 0.3), rgba(6, 78, 59, 0.6)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
        }

        /* TABS ESTILO MINIMALISTA (Baseado na imagem de exemplo) */
        .tab-btn {
            @apply px-4 py-2 text-sm font-semibold transition-all duration-300 relative text-gray-400 border-b-2 border-transparent hover:text-emerald-600;
        }
        .tab-btn.active {
            @apply text-emerald-700 border-emerald-500;
        }

        /* INPUTS - ALTURA MENOR E MAIS SLIM */
        input, select {
            @apply w-full h-10 px-3 bg-white border border-gray-200 rounded-lg text-sm transition-all duration-200 outline-none;
        }
        input:focus, select:focus {
            @apply border-emerald-500 bg-white ring-2 ring-emerald-500/10;
        }

        /* LABEL MAIS PRÓXIMA DO INPUT */
        label {
            @apply block text-[11px] font-bold text-gray-500 mb-1 ml-0.5 uppercase tracking-wide;
        }

        /* ESPAÇAMENTO ENTRE LINHAS */
        .input-group { @apply mb-4; }

        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-4">

<div class="glass-card w-full max-w-md rounded-[2.5rem] shadow-2xl p-8 md:p-10">
    
    <!-- HEADER -->
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-12 h-12 rounded-2xl shadow-md mb-3">
            <i class="fas fa-apple-whole text-white text-xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-500 text-[10px] font-medium uppercase tracking-[0.2em]">Sua saúde, nossa métrica.</p>
    </div>

    <!-- SELETOR DE ABAS ESTILO IMAGEM REFERÊNCIA -->
    <div class="flex justify-center gap-6 mb-8 border-b border-gray-100">
        <button class="tab-btn active" id="tab-cadastro" onclick="switchTab(event, 'cadastro')">Cadastrar</button>
        <button class="tab-btn" id="tab-login" onclick="switchTab(event, 'login')">Entrar</button>
    </div>

    <!-- SEÇÃO DE CADASTRO -->
    <div id="cadastro" class="form-section active">
        
        <div class="input-group">
            <label>Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome">
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="col-span-1">
                <label>Seu melhor E-mail</label>
                <input type="email" id="email" placeholder="email@exemplo.com">
            </div>
            <div class="col-span-1">
                <label>Defina uma Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-4">
            <div class="col-span-1">
                <label>Idade</label>
                <input type="number" id="idade" placeholder="Ex: 25">
            </div>
            <div class="col-span-3">
                <label>Sexo Biológico</label>
                <select id="sexo">
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <div class="input-group !mb-0">
                <label>Peso Atual (kg)</label>
                <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5">
            </div>
            <div class="input-group !mb-0">
                <label>Sua Altura (m)</label>
                <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
            </div>
        </div>

        <div class="input-group">
            <label>Frequência de Atividade</label>
            <select id="atividade">
                <option value="Sedentario">Sedentário (Pouca atividade)</option>
                <option value="Ativo">Ativo (3-5x na semana)</option>
                <option value="Muito Ativo">Atleta (Frequente)</option>
            </select>
        </div>

        <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
            <span>Concluir Cadastro</span>
            <i class="fas fa-arrow-right text-sm"></i>
        </button>
    </div>

    <!-- SEÇÃO DE LOGIN -->
    <div id="login" class="form-section space-y-5 pt-4">
        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="login_email" placeholder="email@exemplo.com">
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="login_senha" placeholder="••••••••">
        </div>
        <button onclick="login()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-3.5 rounded-xl shadow-lg transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
            <span>Acessar Portal</span>
            <i class="fas fa-sign-in-alt text-sm"></i>
        </button>
    </div>

    <!-- MENSAGENS DE FEEDBACK -->
    <div id="resultado" class="mt-6 p-3 rounded-lg text-xs font-bold border text-center transition-all duration-300 hidden"></div>

</div>

<!-- JAVASCRIPT MANTIDO INTEGRALMENTE -->
<script>
    const API_URL = 'https://bsfm-production.up.railway.app';

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active'); 
        event.currentTarget.classList.add('active');
        document.getElementById('resultado').style.display = 'none';
        document.getElementById('resultado').classList.add('hidden');
    }

    async function cadastrar() {
        const resDiv = document.getElementById('resultado');
        const dados = {
            Nome: document.getElementById('nome').value,
            Email: document.getElementById('email').value,
            SenhaHash: document.getElementById('senha').value,
            Idade: parseInt(document.getElementById('idade').value),
            Peso: parseFloat(document.getElementById('peso').value),
            Altura: parseFloat(document.getElementById('altura').value),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        if(!dados.Nome || !dados.Email || !dados.SenhaHash) {
            exibirMensagem("⚠️ Atenção: Preencha Nome, Email e Senha!", "#fffbeb", "#92400e", "#fef3c7");
            return;
        }

        try {
            const resp = await fetch(`${API_URL}/cadastrar-usuario`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const data = await resp.json();
            
            exibirMensagem(`✅ ${data.mensagem}<br>Acesse a aba 'Login' para continuar.`, "#f0fdf4", "#166534", "#dcfce7");
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    async function login() {
        const dados = {
            Email: document.getElementById('login_email').value,
            Senha: document.getElementById('login_senha').value
        };

        try {
            const resp = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (resp.ok) {
                const user = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(user));
                window.location.href = 'dashboard.html'; 
            } else {
                exibirMensagem("⚠️ E-mail ou senha incorretos.", "#fffbeb", "#92400e", "#fef3c7");
            }
        } catch (err) {
            exibirMensagem("❌ Erro ao conectar com o servidor.", "#fef2f2", "#991b1b", "#fee2e2");
        }
    }

    function exibirMensagem(texto, fundo, cor, borda) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.classList.remove('hidden');
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.style.borderColor = borda;
        resDiv.innerHTML = texto;
    }
</script>

</body>
</html>
