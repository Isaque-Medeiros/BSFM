<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Portal Nutricional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }

        .bg-login {
            background: linear-gradient(rgba(240, 253, 244, 0.8), rgba(209, 250, 229, 0.9)), 
                        url('https://images.unsplash.com/photo-1490818387583-1baba5e638af?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .soft-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(6, 78, 59, 0.15);
        }

        .soft-input {
            width: 100%;
            background-color: #f3f4f6;
            border: 2px solid transparent;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.95rem;
            color: #1f2937;
            transition: all 0.3s ease;
            outline: none !important;
        }

        .soft-input:focus {
            background-color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .label-style {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
            margin-left: 0.5rem;
        }

        .tab-btn {
            @apply flex-1 py-3 text-sm rounded-xl transition-all duration-300 font-medium;
        }
        .tab-active {
            background: #d1fae5 !important;
            color: #065f46 !important;
            font-weight: 700;
        }
        .tab-inactive {
            color: #6b7280;
        }

        .form-section { display: none; }
        .form-section.active { display: block; animation: slideUp 0.4s ease-out; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .token-input {
            letter-spacing: 0.8rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-login min-h-screen flex items-center justify-center p-6">

<div class="soft-card w-full max-w-lg p-8 md:p-10">
    
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center bg-emerald-600 w-12 h-12 rounded-2xl shadow-lg mb-4 text-white text-xl">
            <i class="fas fa-apple-whole"></i>
        </div>
        <h2 class="text-2xl font-extrabold text-emerald-900 tracking-tight">Portal BSFM</h2>
        <p class="text-gray-400 text-xs font-medium uppercase tracking-widest mt-1">Sua saúde, nossa métrica</p>
    </div>

    <!-- CORREÇÃO: NAVEGAÇÃO EM UM ÚNICO CONTAINER ID="nav-tabs" -->
    <div id="nav-tabs" class="flex bg-gray-100 rounded-2xl p-1.5 mb-8 gap-2">
        <button onclick="switchTab(event, 'cadastro')" id="btn-cadastro" class="tab-btn tab-active">Criar Conta</button>
        <button onclick="switchTab(event, 'login')" id="btn-login" class="tab-btn tab-inactive">Entrar</button>
    </div>

    <!-- CADASTRO -->
    <div id="cadastro" class="form-section active">
        <div class="flex flex-col gap-4">
            <div>
                <label class="label-style">Nome Completo</label>
                <input type="text" id="nome" class="soft-input" placeholder="Ex: Maria Souza">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="label-style">Seu melhor E-mail</label>
                    <input type="email" id="email" class="soft-input" placeholder="email@exemplo.com">
                </div>
                <div>
                    <label class="label-style">Senha</label>
                    <input type="password" id="senha" class="soft-input" placeholder="••••••••">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <div class="col-span-1">
                    <label class="label-style">Idade</label>
                    <input type="number" id="idade" class="soft-input" placeholder="25">
                </div>
                <div class="col-span-1">
                    <label class="label-style">Sexo</label>
                    <select id="sexo" class="soft-input px-2">
                        <option value="Feminino">Fem</option>
                        <option value="Masculino">Masc</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="label-style">Peso(kg)</label>
                    <input type="number" id="peso" class="soft-input" step="0.1" placeholder="70">
                </div>
                <div class="col-span-1">
                    <label class="label-style">Altura(m)</label>
                    <input type="number" id="altura" class="soft-input" step="0.01" placeholder="1.65">
                </div>
            </div>

            <div>
                <label class="label-style">Frequência de Atividade</label>
                <select id="atividade" class="soft-input">
                    <option value="Sedentario">Sedentário (Pouca)</option>
                    <option value="Ativo">Ativo (Moderada)</option>
                    <option value="Muito Ativo">Muito Ativo (Atleta)</option>
                </select>
            </div>

            <div class="flex items-start gap-2 mb-2 px-1">
                <input type="checkbox" id="checkTermos" class="mt-1 w-4 h-4 text-emerald-600 border-gray-300 rounded cursor-pointer">
                <label for="checkTermos" class="text-[11px] text-gray-500 font-medium leading-tight cursor-pointer">
                    Eu li e concordo com os <button type="button" onclick="abrirTermos()" class="text-emerald-600 font-bold hover:underline">Termos de Contrato e Uso</button>
                </label>
            </div>

            <button onclick="cadastrar()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95">
                Solicitar Código de Ativação <i class="fas fa-paper-plane ml-2"></i>
            </button>
        </div>
    </div>

    <!-- TOKEN -->
    <div id="verificacao-token" class="form-section">
        <div class="text-center mb-6">
            <i class="fas fa-envelope-open-text text-emerald-500 text-5xl mb-4"></i>
            <h3 class="text-lg font-bold text-gray-800">Verifique seu E-mail</h3>
            <p class="text-sm text-gray-500">Insira o código enviado ao e-mail.</p>
        </div>
        <div class="space-y-6">
            <input type="text" id="token_input" class="soft-input token-input" maxlength="6" placeholder="000000">
            <button onclick="verificarToken()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg">
                Ativar Minha Conta <i class="fas fa-shield-alt ml-2"></i>
            </button>
            <button onclick="location.reload()" class="w-full text-gray-400 text-xs hover:underline text-center">Tentar outro e-mail</button>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login" class="form-section">
        <div class="flex flex-col gap-6">
            <div class="flex justify-center mb-2">
                <div class="bg-emerald-50 p-6 rounded-full text-emerald-300 text-5xl">
                    <i class="fas fa-user-lock"></i>
                </div>
            </div>
            <div>
                <label class="label-style">E-mail de acesso</label>
                <input type="email" id="login_email" class="soft-input" placeholder="seu@email.com">
            </div>
            <div>
                <label class="label-style">Sua Senha</label>
                <input type="password" id="login_senha" class="soft-input" placeholder="••••••••">
            </div>
            <p class="text-right">
                <a href="#" onclick="switchTab(null, 'recuperar-senha')" class="text-sm text-emerald-600 font-bold hover:underline">ESQUECI MINHA SENHA?</a>
            </p>
            <button onclick="login()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-4 rounded-2xl shadow-lg transition-all transform active:scale-95">
                Entrar no Painel <i class="fas fa-sign-in-alt ml-2"></i>
            </button>
        </div>
    </div>

    <!-- RECUPERAR SENHA -->
    <div id="recuperar-senha" class="form-section">
        <div id="passo-1-recuperar" class="space-y-4">
            <div class="text-center mb-4"><i class="fas fa-key text-orange-400 text-4xl"></i></div>
            <label class="label-style">Digite seu E-mail</label>
            <input type="email" id="recuperar_email" class="soft-input" placeholder="seu@email.com">
            <button onclick="solicitarCodigoRecuperacao()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl">Enviar Código</button>
        </div>
        <div id="passo-2-recuperar" class="space-y-4 hidden border-t border-gray-100 pt-6">
            <input type="text" id="recuperar_token" class="soft-input token-input" maxlength="6" placeholder="000000">
            <input type="password" id="recuperar_nova_senha" class="soft-input" placeholder="Nova senha">
            <button onclick="finalizarRecuperacao()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl">Salvar Senha</button>
        </div>
        <button onclick="switchTab(null, 'login')" class="w-full text-gray-400 text-sm mt-6 text-center hover:underline">Voltar</button>
    </div>

    <!-- FEEDBACK -->
    <div id="resultado" class="hidden mt-6 p-4 rounded-2xl text-sm font-semibold text-center border"></div>

</div>

<!-- MODAL TERMOS -->
<div id="modalTermos" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl flex flex-col max-h-[70vh]">
        <div class="p-5 border-b flex justify-between bg-emerald-50 rounded-t-3xl">
            <h3 class="text-emerald-900 font-bold text-xs uppercase">Contrato BSFM</h3>
            <button onclick="fecharTermos()" class="text-gray-400"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 overflow-y-auto text-sm text-gray-600">
            <p>Seus dados de Peso e Altura serão usados exclusivamente para cálculo do seu IMC e dieta personalizada...</p>
        </div>
        <div class="p-4 bg-gray-50 text-center rounded-b-3xl">
            <button onclick="fecharTermos()" class="bg-emerald-600 text-white px-6 py-2 rounded-xl text-xs font-bold">OK</button>
        </div>
    </div>
</div>

<script>
    // CORREÇÃO: URL EM HTTPS CONFORME EXIGIDO PELO RAILWAY
    const API_URL = 'https://bsfm-nutric.up.railway.app'; 
    
    let emailAcao = ""; 
    let tokenSistema = ""; 
    let usuarioTemporario = {}; 

    function abrirTermos() { document.getElementById('modalTermos').classList.remove('hidden'); }
    function fecharTermos() { document.getElementById('modalTermos').classList.add('hidden'); }

    function switchTab(event, tabId) { 
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active'); 
        
        const abas = document.getElementById('nav-tabs');
        if(tabId === 'recuperar-senha' || tabId === 'verificacao-token') {
            abas.classList.add('hidden');
        } else {
            abas.classList.remove('hidden');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('tab-active');
            btn.classList.add('tab-inactive');
        });

        if(event && event.currentTarget) {
            event.currentTarget.classList.add('tab-active');
            event.currentTarget.classList.remove('tab-inactive');
        }

        document.getElementById('resultado').style.display = 'none';
        document.getElementById('resultado').classList.add('hidden');
    }

    function exibirMensagem(texto, fundo, cor) {
        const resDiv = document.getElementById('resultado');
        resDiv.style.display = "block";
        resDiv.classList.remove('hidden');
        resDiv.style.backgroundColor = fundo;
        resDiv.style.color = cor;
        resDiv.innerHTML = texto;
    }

    async function cadastrar() {
        const checkTermos = document.getElementById('checkTermos');
        const emailInput = document.getElementById('email').value.trim();
        const senhaInput = document.getElementById('senha').value;
        const peso = document.getElementById('peso').value;
        const altura = document.getElementById('altura').value;

        if (!checkTermos.checked) { exibirMensagem("⚠️ Aceite os termos para prosseguir.", "#fffbeb", "#92400e"); return; }
        if (!emailInput || !senhaInput || !peso || !altura) { exibirMensagem("⚠️ Preencha todos os campos.", "#fffbeb", "#92400e"); return; }

        // Validação Senha
        if (senhaInput.length < 8 || !/[0-9]/.test(senhaInput) || !/[!@#$%^&*()]/.test(senhaInput)) {
            exibirMensagem("⚠️ Senha deve ter 8+ letras, 1 número e 1 símbolo.", "#fffbeb", "#92400e"); return;
        }

        usuarioTemporario = {
            Nome: document.getElementById('nome').value,
            Email: emailInput,
            SenhaHash: senhaInput,
            Idade: parseInt(document.getElementById('idade').value) || 0,
            Peso: parseFloat(peso),
            Altura: parseFloat(altura),
            Sexo: document.getElementById('sexo').value,
            TipoPessoa: document.getElementById('atividade').value,
            AceitouTermos: true
        };

        try {
            exibirMensagem("⏳ Verificando dados...", "#fffbeb", "#92400e");
            const resp = await fetch(`${API_URL}/solicitar-codigo`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ Email: usuarioTemporario.Email })
            });

            if(resp.ok) {
                const data = await resp.json();
                tokenSistema = data.tokenParaJs;
                emailAcao = usuarioTemporario.Email;
                exibirMensagem("📩 Verifique seu código no Mailtrap!", "#f0fdf4", "#166534");
                setTimeout(() => switchTab(null, 'verificacao-token'), 1500);
            } else {
                exibirMensagem("❌ Erro ao solicitar código.", "#fef2f2", "#991b1b");
            }
        } catch(e) { exibirMensagem("❌ Sem conexão com o servidor.", "#fef2f2", "#991b1b"); }
    }

    async function verificarToken() {
        const digitado = document.getElementById('token_input').value;
        if(digitado === tokenSistema) {
            exibirMensagem("🔄 Ativando Perfil...", "#f0fdf4", "#166534");
            const final = await fetch(`${API_URL}/cadastrar-usuario-final`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(usuarioTemporario)
            });
            if(final.ok) {
                exibirMensagem("✅ Perfil ativado com sucesso!", "#f0fdf4", "#166534");
                setTimeout(() => location.reload(), 2000);
            }
        } else { exibirMensagem("⚠️ Código inválido.", "#fef2f2", "#991b1b"); }
    }

    async function solicitarCodigoRecuperacao() {
        emailAcao = document.getElementById('recuperar_email').value;
        if(!emailAcao) { exibirMensagem("⚠️ Informe seu e-mail.", "#fffbeb", "#92400e"); return; }
        try {
            const resp = await fetch(`${API_URL}/esqueci-senha`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ Email: emailAcao })
            });
            if(resp.ok) {
                const data = await resp.json();
                tokenSistema = data.tokenParaJs;
                document.getElementById('passo-1-recuperar').style.display = 'none';
                document.getElementById('passo-2-recuperar').classList.remove('hidden');
                exibirMensagem("🔑 Verifique o código no seu e-mail.", "#f0fdf4", "#166534");
            } else { exibirMensagem("❌ E-mail não encontrado.", "#fef2f2", "#991b1b"); }
        } catch(e) { exibirMensagem("❌ Erro de conexão.", "#fef2f2", "#991b1b"); }
    }

    async function finalizarRecuperacao() {
        const tok = document.getElementById('recuperar_token').value;
        const nPass = document.getElementById('recuperar_nova_senha').value;
        if(tok === tokenSistema && nPass.length >= 8) {
            await fetch(`${API_URL}/redefinir-senha`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ Email: emailAcao, NovaSenha: nPass })
            });
            exibirMensagem("✅ Senha atualizada!", "#f0fdf4", "#166534");
            setTimeout(() => location.reload(), 2000);
        } else { exibirMensagem("⚠️ Código errado ou senha curta.", "#fef2f2", "#991b1b"); }
    }

    async function login() {
        const d = { 
            Email: document.getElementById('login_email').value, 
            Senha: document.getElementById('login_senha').value 
        };
        try {
            const r = await fetch(`${API_URL}/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(d)
            });
            if(r.ok) {
                const info = await r.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(info));
                window.location.href = 'dashboard.html';
            } else { exibirMensagem("⚠️ Login inválido.", "#fef2f2", "#991b1b"); }
        } catch(e) { exibirMensagem("❌ Servidor indisponível.", "#fef2f2", "#991b1b"); }
    }
</script>

</body>
</html>
