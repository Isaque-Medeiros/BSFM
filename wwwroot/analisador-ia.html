<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Analisador IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .view-box { position: relative; width: 100%; max-width: 500px; aspect-ratio: 4/3; background: #111; border-radius: 1.5rem; overflow: hidden; border: 4px solid #10b981; }
        #video, #imgPreview { width: 100%; height: 100%; object-fit: cover; }
        #canvas { display: none; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="p-3 bg-white rounded-xl shadow-sm text-gray-500 hover:text-emerald-600 transition">
                    <i class="fas fa-chevron-left"></i>
                </a>
                <h1 class="text-xl font-bold text-gray-800 tracking-tight">Análise de Prato <span class="text-emerald-600">IA</span></h1>
            </div>
            <div class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-tighter">Live</div>
        </div>

        <!-- Área de Captura/Visualização -->
        <div class="view-box mx-auto mb-6 shadow-2xl relative" id="containerVisualizacao">
            <!-- Câmera Ativa -->
            <video id="video" autoplay playsinline></video>
            
            <!-- Preview do Arquivo Carregado (Oculto Inicialmente) -->
            <img id="imgPreview" class="hidden" alt="Preview do alimento">
            
            <!-- Botão de trocar/resetar se tiver preview -->
            <button id="btnReset" onclick="resetarCaptura()" class="hidden absolute top-4 right-4 bg-red-500 text-white w-10 h-10 rounded-full shadow-lg">
                <i class="fas fa-times"></i>
            </button>
            
            <div id="guiaIA" class="absolute inset-0 border-2 border-dashed border-emerald-400/40 m-8 rounded-2xl pointer-events-none"></div>
        </div>

        <!-- Seleção de Modo: Tirar Foto vs Carregar Arquivo -->
        <div class="grid grid-cols-2 gap-4 mb-8">
             <button onclick="focarCamera()" class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl border-2 border-emerald-50 hover:border-emerald-500 transition-all shadow-sm">
                <i class="fas fa-camera text-emerald-600 text-xl mb-2"></i>
                <span class="text-xs font-bold text-gray-600 uppercase">Câmera</span>
             </button>

             <button onclick="document.getElementById('inputArquivo').click()" class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl border-2 border-emerald-50 hover:border-emerald-500 transition-all shadow-sm">
                <i class="fas fa-folder-open text-blue-600 text-xl mb-2"></i>
                <span class="text-xs font-bold text-gray-600 uppercase">Galeria</span>
             </button>
             <!-- Input de arquivo invisível -->
             <input type="file" id="inputArquivo" accept="image/*" class="hidden" onchange="previewArquivo(this)">
        </div>

        <!-- Seletor de Porção -->
        <div class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-gray-100">
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-4">Selecione o tamanho:</label>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="selecionarPorcao('pequeno', this)" class="btn-porcao py-3 px-1 rounded-xl border border-gray-100 bg-gray-50 text-gray-600 text-sm font-bold">Pequeno</button>
                <button onclick="selecionarPorcao('medio', this)" class="btn-porcao py-3 px-1 rounded-xl border-2 border-emerald-600 bg-emerald-600 text-white text-sm font-bold shadow-lg shadow-emerald-200">Médio</button>
                <button onclick="selecionarPorcao('grande', this)" class="btn-porcao py-3 px-1 rounded-xl border border-gray-100 bg-gray-50 text-gray-600 text-sm font-bold">Grande</button>
            </div>
        </div>

        <!-- Botão de Analisar -->
        <button id="btnSubmit" onclick="iniciarAnalise()" class="w-full bg-gray-900 hover:bg-black text-white font-bold py-5 rounded-2xl shadow-xl transition-all transform active:scale-95 disabled:bg-gray-400">
            <i class="fas fa-brain mr-2 text-emerald-400"></i> ANALISAR AGORA
        </button>

        <!-- Loader Animado -->
        <div id="loader" class="hidden text-center py-10">
            <div class="inline-block animate-spin text-emerald-500 text-4xl mb-2"><i class="fas fa-spinner"></i></div>
            <p class="text-sm font-medium text-gray-500 italic">Consultando algoritmos BSFM...</p>
        </div>

        <!-- Resultados -->
        <div id="resultado" class="hidden mt-8 animate-bounce-short">
             <div class="bg-emerald-600 p-6 rounded-t-3xl text-white">
                <h4 class="text-xs uppercase opacity-80 font-bold mb-1">Análise Concluída</h4>
                <p id="labelAlimento" class="text-2xl font-black capitalize tracking-tight">Nome Alimento</p>
             </div>
             <div class="bg-white p-6 rounded-b-3xl shadow-xl border border-t-0 border-emerald-100 grid grid-cols-2 gap-4">
                <div class="border-r border-gray-100">
                    <p class="text-[10px] uppercase font-bold text-gray-400">Energia (Kcal)</p>
                    <p id="kcal" class="text-2xl font-bold text-gray-800">--</p>
                </div>
                <div class="pl-2">
                    <p class="text-[10px] uppercase font-bold text-gray-400">Macros Sugeridos</p>
                    <div class="text-[11px] font-bold text-emerald-600" id="macros-short">P:-- C:-- G:--</div>
                </div>
                <div class="col-span-2 pt-4 border-t border-gray-50 text-[10px] text-gray-400 text-center italic">
                   Os dados salvos ficarão disponíveis por 2 dias em seu diário.
                </div>
             </div>
        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const API_URL = 'https://bsfm-nutric.up.railway.app'; 
        const video = document.getElementById('video');
        const imgPreview = document.getElementById('imgPreview');
        const canvas = document.getElementById('canvas');
        let streamOriginal = null;
        let arquivoSelecionado = null;
        let porcaoSelecionada = "medio";

        // Inicia Câmera ao Abrir
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(s => { streamOriginal = s; video.srcObject = s; })
            .catch(e => console.warn("Modo câmera indisponível:", e));

        function selecionarPorcao(v, b) {
            porcaoSelecionada = v;
            document.querySelectorAll('.btn-porcao').forEach(btn => {
                btn.className = "btn-porcao py-3 px-1 rounded-xl border border-gray-100 bg-gray-50 text-gray-600 text-sm font-bold";
            });
            b.className = "btn-porcao py-3 px-1 rounded-xl border-2 border-emerald-600 bg-emerald-600 text-white text-sm font-bold shadow-lg shadow-emerald-200";
        }

        // Funções para lidar com arquivos carregados
        function previewArquivo(input) {
            if (input.files && input.files[0]) {
                arquivoSelecionado = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgPreview.src = e.target.result;
                    imgPreview.classList.remove('hidden');
                    video.classList.add('hidden');
                    document.getElementById('btnReset').classList.remove('hidden');
                }
                reader.readAsDataURL(arquivoSelecionado);
            }
        }

        function resetarCaptura() {
            arquivoSelecionado = null;
            document.getElementById('inputArquivo').value = "";
            imgPreview.classList.add('hidden');
            video.classList.remove('hidden');
            document.getElementById('btnReset').classList.add('hidden');
            document.getElementById('resultado').classList.add('hidden');
        }

        function focarCamera() {
            resetarCaptura();
        }

        async function iniciarAnalise() {
            const userData = JSON.parse(localStorage.getItem('usuarioLogado'));
            if(!userData) { window.location.href = 'login.html'; return; }

            let fotoBlob;

            // Interface
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('btnSubmit').classList.add('hidden');
            document.getElementById('resultado').classList.add('hidden');

            // 1. Decidir de onde vem a imagem
            if(arquivoSelecionado) {
                fotoBlob = arquivoSelecionado;
            } else {
                // Tirar print do vídeo agora
                const context = canvas.getContext('2d');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                fotoBlob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.8));
            }

            // 2. Preparar FormData para a Rota C#
            const fd = new FormData();
            fd.append("foto", fotoBlob, "foto.jpg");
            fd.append("porcao", porcaoSelecionada);
            fd.append("usuarioId", userData.id);

            try {
                const response = await fetch(`${API_URL}/analisar-prato`, {
                    method: 'POST',
                    body: fd
                });

                if (response.ok) {
                    const resJson = await response.json();
                    const info = resJson.dados;

                    // Melhora a visualização da lista de alimentos
                    const displayAlimentos = info.alimento || "Alimento não identificado";
                    document.getElementById('labelAlimento').innerText = displayAlimentos;
                    
                    document.getElementById('kcal').innerText = info.calorias + " kcal";

                    // Se vierem múltiplos macros do banco, exibe a soma
                    document.getElementById('macros-short').innerHTML = 
                        `P: <span class="text-white">${info.proteinas}g</span> | ` +
                        `C: <span class="text-white">${info.carbos}g</span> | ` +
                        `G: <span class="text-white">${info.gorduras}g</span>`;
                    
                    document.getElementById('resultado').classList.remove('hidden');
                    document.getElementById('resultado').scrollIntoView({ behavior: 'smooth' });
                } else {
                    alert("A IA não detectou um alimento visível ou não mapeado. Tente outra posição.");
                }
            } catch (err) {
                alert("Servidor BSFM Off-line temporariamente.");
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('btnSubmit').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
