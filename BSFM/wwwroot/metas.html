<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Minhas Metas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="flex items-center gap-4 mb-8">
            <a href="dashboard.html" class="p-3 bg-white rounded-xl shadow-sm text-gray-500 hover:text-emerald-600 transition">
                <i class="fas fa-chevron-left"></i>
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Minhas <span class="text-emerald-600">Metas</span></h1>
        </header>

        <!-- CARD DE PROGRESSO DA META -->
        <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 mb-8 relative overflow-hidden">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 class="text-xs font-black uppercase text-gray-400 tracking-tighter mb-1">Status do Objetivo</h2>
                    <p id="msgProgresso" class="text-gray-700 font-medium">Você ainda não definiu uma meta de peso.</p>
                </div>
                <div class="bg-emerald-100 text-emerald-600 w-10 h-10 rounded-full flex items-center justify-center">
                    <i class="fas fa-trophy"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-8 mb-6">
                <div>
                    <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Peso Atual</p>
                    <p id="pesoAtualDisplay" class="text-3xl font-black text-gray-800">-- kg</p>
                </div>
                <div>
                    <p class="text-[10px] uppercase font-bold text-gray-400 mb-1">Meta Desejada</p>
                    <p id="pesoMetaDisplay" class="text-3xl font-black text-emerald-500">-- kg</p>
                </div>
            </div>

            <!-- Barra de Progresso Visual -->
            <div class="w-full bg-gray-100 h-3 rounded-full overflow-hidden">
                <div id="barraProgresso" class="bg-emerald-500 h-full transition-all duration-700" style="width: 0%"></div>
            </div>
        </div>

        <!-- DEFINIR NOVA META -->
        <div class="bg-emerald-600 rounded-3xl p-6 text-white mb-8 shadow-lg">
            <h3 class="font-bold mb-4">Qual é o seu objetivo?</h3>
            <div class="flex gap-3">
                <input type="number" id="inputMeta" step="0.1" placeholder="Ex: 75.0" class="flex-1 bg-white/10 border-white/20 border rounded-2xl p-4 text-white placeholder:text-white/40 focus:ring-2 focus:ring-white/50 outline-none font-bold">
                <button onclick="definirMeta()" class="bg-white text-emerald-700 px-6 rounded-2xl font-black hover:bg-emerald-50 transition active:scale-95">DEFINIR</button>
            </div>
            <p class="text-[10px] mt-3 opacity-70 italic text-center">* Sugestão BSFM: Metas graduais são mais fáceis de manter a longo prazo.</p>
        </div>

        <!-- ATUALIZAR PESAGEM (AQUELE QUE CRIA O HISTÓRICO) -->
        <div class="bg-white border border-gray-100 rounded-3xl p-6 mb-8 shadow-sm">
            <h3 class="font-bold text-gray-800 mb-4">Registrar Medição de Hoje</h3>
            <div class="flex gap-3">
                <input type="number" id="inputPeso" step="0.1" placeholder="Peso hoje (kg)" class="flex-1 bg-gray-50 border-0 rounded-2xl p-4 focus:ring-2 focus:ring-emerald-500 outline-none">
                <button onclick="registrarPesagem()" class="bg-gray-900 text-white px-8 rounded-2xl font-bold hover:bg-black transition">REGISTRAR</button>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://bsfm-nutric.up.railway.app';
        let userLocal = JSON.parse(localStorage.getItem('usuarioLogado'));

        function inicializar() {
            if(!userLocal) return window.location.href = 'login.html';

            // Garante que os valores sejam números (usando parseFloat) e trata nulos/undefined como 0
            const pesoAtual = parseFloat(userLocal.peso) || 0;
            const pesoMeta = parseFloat(userLocal.pesoMeta) || 0;

            // Atualiza o visual
            document.getElementById('pesoAtualDisplay').innerText = `${pesoAtual.toFixed(1)} kg`;
            
            if (pesoMeta > 0) {
                document.getElementById('pesoMetaDisplay').innerText = `${pesoMeta.toFixed(1)} kg`;
                
                // Cálculo da diferença (Corrige o NaN)
                let diff = Math.abs(pesoAtual - pesoMeta);
                document.getElementById('msgProgresso').innerText = `Faltam ${diff.toFixed(1)} kg para o seu objetivo!`;
                
                // Barra de progresso inteligente
                // Se objetivo é emagrecer: meta/atual. Se é ganhar: atual/meta.
                let porc = (pesoMeta > pesoAtual) ? (pesoAtual / pesoMeta) * 100 : (pesoMeta / pesoAtual) * 100;
                
                document.getElementById('barraProgresso').style.width = Math.min(porc, 100) + "%";
            } else {
                document.getElementById('pesoMetaDisplay').innerText = "--";
                document.getElementById('msgProgresso').innerText = "Defina sua meta abaixo para começar!";
            }
        }

        async function definirMeta() {
            const metaVal = document.getElementById('inputMeta').value;
            if(!metaVal) return;

            try {
                const resp = await fetch(`${API_URL}/definir-meta`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ UsuarioId: userLocal.id, PesoMeta: parseFloat(metaVal) })
                });

                if(resp.ok) {
                    const data = await resp.json();
                    userLocal.pesoMeta = data.pesoMeta;
                    localStorage.setItem('usuarioLogado', JSON.stringify(userLocal));
                    alert("🎯 Meta estabelecida! Vamos focar na alimentação e rotina.");
                    location.reload();
                }
            } catch(e) { alert("Erro de conexão."); }
        }

        async function registrarPesagem() {
            const novoPeso = document.getElementById('inputPeso').value;
            if(!novoPeso) return;

            // Chame sua rota de 'atualizar-medicao' (da mensagem anterior) aqui...
            // Ela vai atualizar o peso e o histórico no banco de dados.
            const resp = await fetch(`${API_URL}/atualizar-medicao`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    UsuarioID: userLocal.id, 
                    Peso: parseFloat(novoPeso), 
                    Altura: userLocal.altura || 1.70 
                })
            });

            if(resp.ok) {
                const r = await resp.json();
                localStorage.setItem('usuarioLogado', JSON.stringify(r.userAtualizado)); // Mantendo sincronizado
                location.reload();
            }
        }

        window.onload = inicializar;
    </script>

</body>
</html>
