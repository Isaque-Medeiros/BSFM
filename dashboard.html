<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>BSFM - Meu Painel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f0f2f5; padding: 20px; }
        .card { max-width: 500px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2ecc71; }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 10px; margin: 10px 0; border-left: 5px solid #2ecc71; text-align: left; }
        button { background: #e74c3c; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Bem-vindo(a), <span id="displayNome">...</span>!</h1>
    
    <div class="info-box">
        <strong>Seu IMC:</strong> <span id="displayIMC"></span>
    </div>
    <div class="info-box">
        <strong>Metabolismo Basal:</strong> <span id="displayTMB"></span> kcal
    </div>
    <div class="info-box">
        <strong>Gasto Diário Estimado:</strong> <span id="displayGasto"></span> kcal
    </div>

    <button onclick="sair()">Sair</button>
</div>

<script>
    // Quando a página abre, ela verifica se há alguém logado
    window.onload = function() {
        const dados = localStorage.getItem('usuarioLogado');
        
        if (!dados) {
            // Se não tem dados, volta para o login
            window.location.href = 'index.html';
            return;
        }

        const user = JSON.parse(dados);
        
        // Preenche a tela com os dados vindos do C#
        document.getElementById('displayNome').innerText = user.nome;
        document.getElementById('displayIMC').innerText = user.imc;
        document.getElementById('displayTMB').innerText = user.tmb;
        document.getElementById('displayGasto').innerText = user.gasto;
    };

    function sair() {
        localStorage.removeItem('usuarioLogado');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
