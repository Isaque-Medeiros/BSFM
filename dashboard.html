<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSFM - Meu Painel</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #0a0b0d;
            --bg-container: rgba(20, 25, 30, 0.7);
            --accent-color: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --card-bg: rgba(255, 255, 255, 0.03);
            --input-border: rgba(0, 242, 255, 0.15);
            --glass-blur: blur(15px);
            --danger-color: #ff4757;
        }

        .light-mode {
            --bg-body: #f4f7f6;
            --bg-container: rgba(255, 255, 255, 0.9);
            --accent-color: #008b8b;
            --accent-glow: rgba(0, 139, 139, 0.2);
            --text-main: #2c3e50;
            --text-dim: #7f8c8d;
            --card-bg: #ffffff;
            --input-border: #d1d8e0;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 242, 255, 0.03) 0%, transparent 30%),
                radial-gradient(circle at 100% 100%, rgba(0, 242, 255, 0.03) 0%, transparent 30%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--bg-container);
            border: 1px solid var(--input-border);
            color: var(--accent-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            backdrop-filter: var(--glass-blur);
        }

        .dashboard-container { 
            background: var(--bg-container); 
            width: 90%;
            max-width: 600px; 
            padding: 40px; 
            border-radius: 30px; 
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--input-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            margin-bottom: 30px; 
            letter-spacing: 1px;
            color: var(--text-main);
        }

        #displayNome {
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Layout em Grade para Métricas */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--input-border);
            padding: 20px;
            border-radius: 20px;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.1);
        }

        .metric-card strong {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .metric-card span {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Diferenciação de métricas (kcal vs unitario) */
        .metric-value-large { font-size: 20px !important; }

        .btn-exit { 
            background: transparent;
            color: var(--danger-color); 
            border: 1px solid var(--danger-color); 
            padding: 12px 30px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 12px;
        }

        .btn-exit:hover { 
            background: var(--danger-color);
            color: #fff;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Estilo responsivo mobile */
        @media (max-width: 480px) {
            .metrics-grid { grid-template-columns: 1fr; }
            .dashboard-container { padding: 25px; }
        }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">DARK / LIGHT</button>

<div class="dashboard-container">
    <h1>BEM-VINDO, <span id="displayNome">...</span>!</h1>
    
    <div class="metrics-grid">
        <div class="metric-card">
            <strong>Meu IMC</strong>
            <span id="displayIMC">--</span>
        </div>
        
        <div class="metric-card">
            <strong>Metabolismo Basal</strong>
            <span id="displayTMB" class="metric-value-large">--</span> <small style="color:var(--text-dim)">kcal</small>
        </div>

        <div class="metric-card">
            <strong>Gasto Diário (TDEE)</strong>
            <span id="displayGasto" class="metric-value-large">--</span> <small style="color:var(--text-dim)">kcal</small>
        </div>
    </div>

    <!-- Se precisar adicionar mais funcionalidades futuramente, elas entrarão aqui em novos cards -->

    <button class="btn-exit" onclick="sair()">Finalizar Sessão</button>
</div>

<script>
    // UX: Alternar entre temas
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    // --- SUA LÓGICA ORIGINAL ABAIXO (MANTIDA INTEGRALMENTE) ---

    window.onload = function() {
        const dados = localStorage.getItem('usuarioLogado');
        
        if (!dados) {
            window.location.href = 'index.html';
            return;
        }

        const user = JSON.parse(dados);
        
        document.getElementById('displayNome').innerText = user.nome.toUpperCase();
        document.getElementById('displayIMC').innerText = user.imc;
        document.getElementById('displayTMB').innerText = user.tmb;
        document.getElementById('displayGasto').innerText = user.gasto;
    };

    function sair() {
        localStorage.removeItem('usuarioLogado');
        window.location.href = 'index.html';
    }
</script>

</body>
</html>
